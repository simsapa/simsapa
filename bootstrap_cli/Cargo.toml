[package]
name = "simsapa_bootstrap_cli"
version = "0.1.0"
edition = "2024"
authors = ["Gambhiro Bhikkhu <profound.labs@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "simsapa_bootstrap_cli"
path = "src/main.rs"

[dependencies]
simsapa_backend = { path = "../backend" }
tipitaka_xml_parser = { path = "../../tipitaka-xml-parser" }
clap = { version = "4.5.37", features = ["derive", "env"] }
dotenvy = "0.15.7"
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.3.9", features = ["sqlite"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
arangors = "0.6.0"
scraper = "0.21.0"
ego-tree = "0.9"
reqwest = { version = "0.12", features = ["blocking"] }
indicatif = "0.17"
regex = "1.11"
lazy_static = "1.5"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }
quick-xml = "0.31"
html-escape = "0.2"
indexmap = { version = "2.0", features = ["serde"] }
# suttas-core-compatible hashes of segment files (segment_files.rs).
sha2 = "0.10"
# Reads the Dhamma Verses Commentary epub (dhammapada_commentary_anandajoti.rs).
# Same spec as simsapa_backend, so it adds no crate to the build.
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
urlencoding = "2.1"
toml = "1.1.6"
# NOTE: The utils::render_markdown() was removed after mdbook v0.4
mdbook = "0.4"

[dev-dependencies]
tempfile = "3.8"

# Dependencies are built optimised in dev and test builds: SQLite (compiled C),
# regex and sha2 at opt-level 0 made the tests on the dist databases several
# times slower. The project's own crates stay unoptimised, so they rebuild fast
# after an edit and step cleanly in a debugger.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.simsapa_backend]
opt-level = 0

[profile.dev.package.tipitaka_xml_parser]
opt-level = 0
