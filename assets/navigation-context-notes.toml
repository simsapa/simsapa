# Vinayapiṭaka (aṭṭhakathā)
["cst:atthakatha/vinayapiṭaka-aṭṭhakathā"]
from = 400
to = 430
circa = true
note = """
Origin: early 5th century CE, Sri Lanka (Anurādhapura). The Samantapāsādikā,
ascribed to Buddhaghosa: a Pāli rendering of older Sinhala commentaries (the
Mahā-aṭṭhakathā, Mahāpaccarī and Kurundī) kept at the Mahāvihāra, begun in the
20th and completed in the 21st year of King Sirinivāsa Sirīpāla, identified
with Mahānāma (r. c. 407–429), so complete by 428 CE. Well anchored in date:
translated into Chinese in 489 CE, though some scholars question Buddhaghosa's own hand in it, and the age of the Sinhala
sources is known only from tradition.
"""

# Dīgha nikāya (aṭṭhakathā)
["cst:atthakatha/suttapiṭaka-aṭṭhakathā/dīgha-nikāya-aṭṭhakathā"]
from = 400
to = 430
circa = true
note = """
Origin: early 5th century CE, Sri Lanka (Anurādhapura). The Sumaṅgalavilāsinī,
by Buddhaghosa: a Pāli rendering of older Sinhala commentaries kept at the
Mahāvihāra, made at the end of the reign of King Mahānāma (r. c. 407–429),
about 429–430 CE, at the invitation of Dāṭhānāga of the Sumaṅgala Pariveṇa.
Well anchored: his authorship is accepted by scholarly consensus, though it
rests on the prologue tradition and closing sentences added by his pupils.
The colophon naming him is theirs, not his. The age of the Sinhala sources is
known only from tradition.
"""

# Majjhimanikāya (aṭṭhakathā)
["cst:atthakatha/suttapiṭaka-aṭṭhakathā/majjhimanikāya-aṭṭhakathā"]
from = 400
to = 430
circa = true
note = """
Origin: early 5th century CE, Sri Lanka (Anurādhapura). The Papañcasūdanī, by
Buddhaghosa: a Pāli rendering of older Sinhala commentaries kept at the
Mahāvihāra, made in the reign of King Mahānāma (r. c. 407–429), at the
invitation of his former co-resident at Mayūrapaṭṭana, Buddhamitta. Well
anchored: his authorship is accepted by scholarly consensus. The age of the Sinhala
sources is known only from tradition.
"""

# Saṁyuttanikāya (aṭṭhakathā)
["cst:atthakatha/suttapiṭaka-aṭṭhakathā/saṃyuttanikāya-aṭṭhakathā"]
from = 400
to = 430
circa = true
note = """
Origin: early 5th century CE, Sri Lanka (Anurādhapura). The Sāratthappakāsinī,
by Buddhaghosa: a Pāli rendering of older Sinhala commentaries kept at the
Mahāvihāra, made at the end of the reign of King Mahānāma (r. c. 407–429),
about 429–430 CE, at the invitation of his Kāñcīpura co-resident Jotipāla.
Well anchored: his authorship is accepted by scholarly consensus. The age of the Sinhala
sources is known only from tradition.
"""

# Aṅguttaranikāya (aṭṭhakathā)
["cst:atthakatha/suttapiṭaka-aṭṭhakathā/aṅguttaranikāya-aṭṭhakathā"]
from = 400
to = 435
circa = true
note = """
Origin: early 5th century CE, Sri Lanka (Anurādhapura). The Manorathapūraṇī,
by Buddhaghosa: a Pāli rendering of older Sinhala commentaries kept at the
Mahāvihāra, assigned to about 432 CE: the last of the four Nikāya
commentaries, written at the invitation of Jotipāla and the lay disciple
Jīvaka. Well anchored:
his authorship is accepted by scholarly consensus. The age of the Sinhala
sources is known only from tradition.
"""

# Khuddakanikāya (aṭṭhakathā)
["cst:atthakatha/suttapiṭaka-aṭṭhakathā/khuddakanikāya-aṭṭhakathā"]
from = 400
note = """
Origin: 5th century CE and later, Sri Lanka and South India; several authors.
The Dhammapada commentary (invited by Kumārakassapa, written at a vihāra of
King Sirikuḍḍa) and the Jātaka commentary are anonymous works of about the 5th
century: the Jātaka's ascription to Buddhaghosa is first recorded in the 11th
century and is rejected by Malalasekera and A. P. Buddhadatta. Dhammapāla, who
names himself in his colophons as of the Badaratittha-vihāra (identified by
A. P. Buddhadatta with Nāgapaṭṭana on the Coromandel coast, though some place
Badaratittha in Sri Lanka) wrote on the Udāna, Itivuttaka, Vimānavatthu,
Petavatthu, Thera- and Therīgāthā and the Cariyāpiṭaka some time after
Buddhaghosa; the Buddhavaṁsa commentary is by Buddhadatta at Kāveripaṭṭana,
the Niddesa commentary by Upasena, the Paṭisambhidāmagga commentary by
the monk Mahānāma, and the Apadāna commentary is anonymous. Contested: authorship and
dates are far less secure than for the commentaries on the four Nikāyas.
"""

