# Sāratthadīpanī-ṭīkā-1
["cst:vin01t1.tik"]
from = 1165
to = 1186
circa = true
note = """
Origin: late 12th century CE, Sri Lanka (Polonnaruva). The Sāratthadīpanī, by
Sāriputta of Polonnaruva: a sub-commentary on the Samantapāsādikā, written
after the unification of the three fraternities in 1165, and before about
1186, by which time Buddhanāga had written a new sub-commentary
(abhinavaṭīkā) on it. His name is not in the text; it is
attested in his Sinhalese paraphrase and in three commentaries by his pupils
(Kieffer-Pülz). Well anchored to that two-decade window.
"""

