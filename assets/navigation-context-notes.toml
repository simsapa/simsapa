# ============================================================================
# Sutta: Khuddaka Nikāya
# ============================================================================

# Khuddakapāṭha
["kp"]
note = """
Origin: a late compilation; date, place and compiler unknown. Nine short
texts, all but one found elsewhere in the canon, perhaps put together as a
handbook for novices. Absent from both the Dīgha-bhāṇaka and Majjhima-bhāṇaka
canonical lists, and pointedly omitted by the Chinese Samantapāsādikā (489
CE); the fifteenfold Khuddaka Nikāya that gives it first place is a Mahāvihāra
concept established through Buddhaghosa's commentaries (Abeynayake 2000).
Estimated: scholars place it in the late stratum of the Khuddaka Nikāya, and
it became canonical late, in Sri Lanka.
"""

# Dhammapada
["dhp"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Verses ascribed to the Buddha,
from the early oral tradition; compiler unknown. Gathered as a collection by
about the 3rd century BCE; the Dharmapadas of other schools share a core of
some 330 verses (Brough). Estimated: counted in the early stratum, with no
firm date for the compilation.
"""

# Udāna
["ud"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Inspired utterances ascribed to
the Buddha, each set in a short narrative; compiler unknown. Counted among the
early texts and largely fixed by the 1st century BCE. The collection is in two
layers: the utterances, mostly verse, are the older one and travelled without
their frames; the same verses stand in other Pāḷi collections under other
settings, and in the Sanskrit Udānavarga, which carries no prose at all. The
prose frames were added later, partly composed and partly borrowed from the
Vinaya Khandhakas and the Mahāparinibbānasutta. Contested: most scholars take
the verses as primary (Anālayo, Ānandajoti), while Masefield reads them as
appended to the prose. Estimated from internal and comparative evidence.
"""

# Itivuttaka
["iti"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Short discourses of the Buddha,
by tradition memorised and passed on by the laywoman Khujjuttarā of Kosambī.
Contested: some scholars place it among the very oldest Buddhist texts, others
somewhat later; the dating rests on internal and comparative evidence.
"""

# Suttanipāta
["snp"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Discourses in verse ascribed to
the Buddha; compilers unknown. Its Aṭṭhakavagga and Pārāyanavagga are among
the oldest Buddhist texts known. The canon itself comments on them in the
Niddesa, while the collection as a whole was assembled later. Contested: some
date those chapters to the Buddha's lifetime, others hold this cannot be
shown.
"""

# Vimānavatthu
["vv"]
from = -300
circa = true
note = """
Origin: not before about 300 BCE, probably India. Authors unknown. Verse
stories of rebirth in the heavens, added late to the canon; some individual
stories may be older. Estimated: placed in the late stratum on internal
grounds, with no external dating.
"""

# Petavatthu
["pv"]
from = -300
circa = true
note = """
Origin: not before about 300 BCE, probably India. Authors unknown. Verse
stories of rebirth among the departed, added late to the canon; some
individual stories may be older. Estimated: the floor of about 300 BCE was
proposed for this text and is also applied to its twin, the Vimānavatthu; no
upper bound has been proposed.
"""

# Theragāthā
["thag"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Verses ascribed to named monks,
most of them of the Buddha's time; compilers unknown. Collected over some
three centuries and closed around the Third Council under Aśoka (mid-3rd
century BCE). Estimated: metre and content show both early and later verses.
"""

# Therīgāthā
["thig"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Verses ascribed to named nuns of
the Buddha's time; compilers unknown. Composed over centuries, the latest
verses dating to about the late 3rd century BCE. Contested: whether the verses
were composed by the women they are ascribed to cannot be shown (Faure).
"""

# Therāpadāna
["tha-ap"]
from = -200
to = -1
circa = true
note = """
Origin: c. 2nd–1st century BCE, probably India. Authors unknown. Verse legends
of the past lives of senior monks, told in their own voice; among the last
additions to the canon. Estimated: Walters dates it and its two companion
texts, the Buddhavaṁsa and the Cariyāpiṭaka, to about
the 2nd century BCE on their correspondence with stūpa epigraphy; Warder's
metre-based estimate for the Apadāna is about 100 BCE; Norman argued lateness
from its subject matter; Bechert put the Buddhāpadāna section alone as late as
the 1st–early 2nd century CE.
"""

# Therīapadāna
["thi-ap"]
from = -200
to = -1
circa = true
note = """
Origin: c. 2nd–1st century BCE, probably India. Authors unknown. Verse legends
of the past lives of senior nuns, told in their own voice; among the last
additions to the canon. See Therāpadāna for the dating evidence. The
Apadāna's commentary never covered the nuns' stories, and the text was edited
several times: the commentary presupposes more stories than any printed
edition has.
"""

# Buddhavaṁsa
["bv"]
from = -200
to = -1
circa = true
note = """
Origin: c. 2nd–1st century BCE, probably India. Authors unknown. A verse
chronicle of Gotama and the Buddhas before him, presented as spoken by the
Buddha; among the last additions to the canon. Walters dates it, the
Cariyāpiṭaka and the Apadāna to about the 2nd century BCE on stūpa-epigraphy
correspondence. The text was also enlarged in Sri Lanka after its commentary
was written (Abeynayake).
"""

# Cariyāpiṭaka
["cp"]
from = -200
to = -1
circa = true
note = """
Origin: c. 2nd–1st century BCE, probably India. Authors unknown. Verse
accounts of the Buddha's past lives, presented as spoken by the Buddha; among
the last additions to the canon. Walters dates it, the Buddhavaṁsa and the
Apadāna to about the 2nd century BCE on stūpa-epigraphy correspondence.
"""

# Jātaka
["ja"]
from = -500
note = """
Origin: verses from the 5th century BCE onward, India. Authors unknown. Only
the verses are canonical; the stories around them were fixed in a commentary
of about the 5th century CE, whose ascription to Buddhaghosa is first recorded
in the 11th century and is rejected by Malalasekera and A. P. Buddhadatta.
Partly anchored: reliefs at Bhārhut and Sāñcī (2nd–1st century BCE) show
that many of the stories were already current then.
"""

# Mahāniddesa
["mnd"]
from = -300
to = -1
circa = true
note = """
Origin: c. 3rd–1st century BCE, India. Traditionally ascribed to Sāriputta;
the actual author is unknown. A commentary on the Aṭṭhakavagga of the
Suttanipāta, included in the canon. Contested: placed anywhere from Aśoka's
time to the 1st century BCE, the latter being the latest date possible.
"""

# Cūḷaniddesa
["cnd"]
from = -300
to = -1
circa = true
note = """
Origin: c. 3rd–1st century BCE, India. Traditionally ascribed to Sāriputta;
the actual author is unknown. A commentary on the Pārāyanavagga and the
Khaggavisāṇa Sutta of the Suttanipāta, included in the canon. Contested:
placed anywhere from Aśoka's time to the 1st century BCE, the latter being the
latest date possible.
"""

# Paṭisambhidāmagga
["ps"]
from = -300
to = 200
note = """
Origin: between the 3rd century BCE and the 2nd century CE, India.
Traditionally ascribed to Sāriputta; the actual author is unknown. A
systematic treatise in the manner of the Abhidhamma. Contested: Warder puts an
early form in the 3rd century BCE, Cousins in the 1st century BCE, von Hinüber
around the 2nd century CE.
"""

# Netti
["ne"]
from = -50
to = 50
circa = true
note = """
Origin: around the turn of the Common Era, northern India, perhaps Ujjain.
Ascribed to the Buddha's disciple Mahākaccāna, which scholars do not take
literally; the actual author is unknown. A guide to interpreting the
discourses, reworking the Peṭakopadesa (Norman). Its verses are in the āryā metre,
in use around 150 BCE and unknown in Sri Lanka, and Buddhaghosa quotes it, so
it predates him. Estimated from metre, style and that quotation. Canonical in the
Burmese tradition.
"""

# Peṭakopadesa
["pe"]
to = -50
circa = true
note = """
Origin: date unknown, India; older than the Netti, which reworks it. Ascribed
to the Buddha's disciple Mahākaccāna, which scholars do not take literally;
the actual author is unknown. A guide to interpreting the discourses; most of
its sixth chapter was translated into Chinese by the 3rd century CE (the Yin
chi ru jing; Zacchetti). Uncertain: nothing dates it beyond its priority to the
Netti and that translation. Canonical in the Burmese tradition.
"""

# Milindapañha
["mil"]
from = -100
to = 200
circa = true
note = """
Origin: c. 100 BCE–200 CE, north-west India. Author unknown. A dialogue
between the monk Nāgasena and the Indo-Greek king Menander, who ruled in the
2nd century BCE; a composite work, enlarged over time, perhaps first composed
in Gāndhārī (von Hinüber). Partly anchored by Menander's reign; the dates of
the later books are estimates. Canonical in the Burmese tradition.
"""

# ============================================================================
# Vinaya
# ============================================================================

# Bhikkhu Pātimokkha
["pli-tv-bu-pm"]
from = -500
to = -300
note = """
Origin: 5th–4th century BCE, northern India. The monks' rules, ascribed to the
Buddha and by tradition recited by Upāli at the First Council. The same core
code is found in the six surviving school Vinayas (Theravāda, Mahāsāṁghika,
Mahīśāsaka, Dharmaguptaka, Sarvāstivāda, Mūlasarvāstivāda), so it is inferred
to predate the first schisms. Well supported by that comparison for the core;
absolute dates remain estimates.
"""

# Bhikkhunī Pātimokkha
["pli-tv-bi-pm"]
from = -500
to = -300
note = """
Origin: 5th–4th century BCE, northern India. The nuns' rules, ascribed to the
Buddha and by tradition recited by Upāli at the First Council. Estimated:
supported by comparison between the six school Vinaya lineages, with no
absolute dating.
"""

# Bhikkhu Vibhaṅga
["pli-tv-bu-vb"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Compilers unknown; by tradition
recited by Upāli at the First Council. Each rule of the monks' Pātimokkha with
its origin story, a word-by-word explanation and case rulings. Layers that
grew around the rules after they were laid down. Contested: the rules are the
oldest layer, and the dates at which the explanations formed are estimates
with real scholarly disagreement.
"""

# Bhikkhunī Vibhaṅga
["pli-tv-bi-vb"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Compilers unknown; by tradition
recited by Upāli at the First Council. Each rule of the nuns' Pātimokkha with
its origin story, a word-by-word explanation and case rulings. Layers that
grew around the rules after they were laid down. Contested: the rules are the
oldest layer, and the dates at which the explanations formed are estimates
with real scholarly disagreement.
"""

# Khandhaka
["pli-tv-kd"]
from = -400
to = -200
note = """
Origin: 4th–3rd century BCE, northern India. Compilers unknown. The procedures
of community life; it closes with accounts of the First and Second Councils,
so its final form is later than the Second, about a century after the Buddha's
death. Contested: Frauwallner (1956) argued it was composed around that
council. Still influential, but disputed.
"""

# Parivāra
["pli-tv-pvr"]
from = -100
circa = true
note = """
Origin: c. 1st century BCE or later, Sri Lanka. Its colophon names a monk Dīpa
as the one who had it written down for the ease of his pupils. A digest and
catechism of the rest of the Vinaya, and its latest book: it names Sri Lanka
(Tambapaṇṇī) and Mahinda's arrival "here" from India, and its teacher list
runs through monks flourishing under Vaṭṭagāmaṇi. Abeynayake argues its first
two chapters are the far older core brought from India, the remainder a Sri
Lankan appendix. Anchored as late by its own list of teachers; the exact date
is an estimate.
"""

