# Vajirabuddhi-ṭīkā
["cst:vin06t.nrf"]
from = 900
to = 1200
circa = true
note = """
Origin: between the 10th and 12th centuries CE, Sri Lanka or South India.
Anonymous and undated; the work calls itself a glossary-commentary
(gaṇṭhipada) on the Samantapāsādikā and is called a ṭīkā only from the 12th
century. The earliest mention of Vajirabuddhi as its author is from the 13th
century.
Kieffer-Pülz judges an origin in the 10th century highly likely; Malalasekera
put it in the early 12th. Contested. The oldest surviving sub-commentary on
the Vinaya commentary.
"""

# Dīghanikāya (ṭīkā)
["cst:tika/suttapiṭaka-ṭīkā/dīghanikāya-ṭīkā"]
from = 450
to = 700
circa = true
note = """
Origin: c. mid-5th–7th century CE, probably South India. The
Līnatthappakāsinī, the old sub-commentary: its colophon names Dhammapāla, a
junior contemporary of Buddhaghosa, though his exact date is not settled, nor
whether he is the Dhammapāla of the Khuddaka commentaries. The two
Abhinavaṭīkā volumes here are a separate work: the Sādhuvilāsinī of
Ñāṇābhivaṁsa, Burma, about 1800 CE (its colophon names him as teacher of King
Bodawpaya).
"""

