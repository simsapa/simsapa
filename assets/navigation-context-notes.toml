# Context notes for the Sutta Navigation window.
#
# One table per node: the table name is the node's `node_uid`, and its `note`
# field is the note shown under the SuttaCentral summary. See
# docs/sutta-navigation-tree.md §2f, and
# docs/navigation-context-notes-research.md for the evidence behind each.
#
#     ["dn"]
#     from = -500
#     to = -200
#     note = """
#     Origin: 5th–3rd century BCE, northern India. …
#     """
#
# - Always quote the table name: ["sn56.11"], ["cst:tika"]. Unquoted, the dots
#   are read as nested tables and the build fails.
# - `note` is required. A field the app does not know fails the build, so a
#   misspelled field name cannot be dropped silently.
# - Wrap lines freely inside the triple quotes. Line breaks are joined into
#   spaces; a blank line starts a new paragraph.
# - `from`, `to` and `circa` say when the text originated. They place the node
#   on the Timeline page; the note is shown as written and is not generated
#   from them. All three are optional:
#     from   earliest year, a whole number. BCE is negative: -500 is 500 BCE.
#     to     latest year.
#     circa  true when the bounds are approximate. Left out, it is false.
#   Only `from` means "not before", only `to` means "not after", and an entry
#   with neither is listed as undated. There is no year 0: do not write 0.
# - Centuries are written as round numbers, and "early", "late" and "second
#   half of" take the matching third or half, with circa:
#     "5th–3rd century BCE"                      from = -500, to = -200
#     "12th century CE"                          from = 1100, to = 1200
#     "c. 2nd–1st century BCE"                   from = -200, to = -1, circa
#     "early 5th century CE"                     from = 400, to = 430, circa
#     "second half of the first millennium CE"   from = 500, to = 1000, circa
#     "c. 100 BCE–200 CE"                        from = -100, to = 200, circa
#     "around the turn of the Common Era"        from = -50, to = 50, circa
#     "not before about 300 BCE"                 from = -300, circa
#     "5th century CE and later"                 from = 400
#     "date unknown; older than X"               to = X's from, circa
#     "See Dīghanikāya."                         the fields of that entry
#     no estimate in the note or the research    no date fields
#   The 1st century BCE ends at -1, the year before 1 CE.
# - circa is true whenever the note says c., about, around, probably, early or
#   late, or the bound is an inference.
# - Find a key with:
#     SELECT node_uid, title_pali FROM navigation_nodes;
# - Rebuild the app to apply an edit. `build-navigation-tree` reports a key
#   that names no node.

# ============================================================================
# Sutta: the four Nikāyas
# ============================================================================

# Dīghanikāya
["dn"]
from = -500
to = -200
note = """
Origin: 5th–3rd century BCE, northern India. Discourses of the Buddha and his
disciples, by tradition recited by Ānanda at the First Council; the compilers
are unknown, gathered by length into this collection. Largely fixed before
Aśoka (mid-3rd century BCE) and written down in Sri Lanka in the 1st century
BCE. Contested: Wynne (2003) defends the Aśokan-mission tradition, that much
of the Sutta and Vinaya reached Sri Lanka around 250 BCE; Schopen counters that no definite
evidence of the canon's contents predates the earliest manuscripts (5th–6th
century CE). The dating rests on internal and comparative evidence rather than
early manuscripts.
"""

