# Aṅguttaranikāya (ṭīkā)
["cst:tika/suttapiṭaka-ṭīkā/aṅguttaranikāya-ṭīkā"]
from = 1100
to = 1200
note = """
Origin: 12th century CE, Sri Lanka. The Sāratthamañjūsā, ascribed to
Sāriputta, of the circle of scholars working under Parakkamabāhu I
(1153–1186); its colophon names only the work, the attribution resting on
external testimony. Well anchored to that period.
"""
