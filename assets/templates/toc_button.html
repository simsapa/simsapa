<!-- Table of Contents button. Only rendered on book chapter pages, placed
     between the reading mode button and the prev/next chapter navigation
     buttons. The icon is the one the sidebar's TOC tab uses. -->
<button class="find-search-button chapter-nav-button"
        id="tocTabButton"
        data-spine-item-uid="{current_spine_item_uid}"
        data-book-uid="{current_book_uid}"
        aria-label="Table of contents"
        title="Table of contents">
    <img src="{api_url}/assets/icons/32x32/bxs_book_bookmark.png"
         alt="Table of contents"
         class="chapter-nav-icon">
</button>
