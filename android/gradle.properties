# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable building projects in parallel
org.gradle.parallel=true

# Gradle caching allows reusing the build artifacts from a previous
# build with the same inputs. However, over time, the cache size will
# grow. Uncomment the following line to enable it.
#org.gradle.caching=true
#org.gradle.configuration-cache=true

# Allow AndroidX usage
android.useAndroidX=true

# androiddeployqt writes androidCompileSdkVersion=android-36 (it picks the
# newest installed platform), while AGP 8.6.0 was only tested up to 35, so every
# build prints a "we recommend a newer Android Gradle plugin" warning. The
# warning is expected and the pin is deliberate: AGP, the Gradle wrapper and the
# JDK pin are coupled, and that bump belongs with the eventual Qt upgrade.
# See the AGP section in AGENTS.md and docs/android-multi-abi-and-chromeos.md.
#
# NOTE: the wrapper in android/gradle/wrapper/ is OURS (checked in, currently
# 8.10) and is copied into android-build/ along with the rest of android/ — it
# is NOT taken from Qt, whose kits ship 8.12. Verified in the generated
# android-build/gradle/wrapper/gradle-wrapper.properties.
#
# androiddeployqt appends its generated keys to a copy of this file rather than
# overwriting it, so these lines survive into android-build/gradle.properties.
android.suppressUnsupportedCompileSdk=36
