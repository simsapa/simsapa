buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // NOTE: this version is coupled to MAX_JDK_MAJOR in build-android.sh.
        // AGP 8.6.0's bundled Android Lint cannot parse a JDK 26 version string
        // and dies with the version number as its only error message, so the
        // build script pins the JDK to 17-21. Raise both together.
        // See docs/android-multi-abi-and-chromeos.md.
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.13.1'
}

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion

    // NDK is driven by the QtCreator kit (androidNdkVersion, written into
    // gradle.properties). Stay on the Qt 6.9.3-supported NDK (r26b/r27). Do NOT
    // force r28: at minSdk 27 its libc++ references pthread_cond_clockwait
    // (declared by bionic only at API 30+), which breaks the cxx C++ build.
    // 16 KB page alignment is achieved instead via the max-page-size linker flag
    // on the main app .so (see target_link_options in CMakeLists.txt).
    ndkVersion androidNdkVersion

    // Extract native libraries from the APK
    packagingOptions.jniLibs.useLegacyPackaging true

    // Drop libraries staged into the wrong ABI directory.
    //
    // In a multi-ABI build, the final androiddeployqt pass resolves the
    // dependency list for every ABI and, for some of them, copies the PRIMARY
    // ABI's Qt plugins into the other ABIs' staging folders. Verified with
    // `androiddeployqt --verbose`: during the armeabi-v7a phase it emits
    //   -- Copied .../libs/armeabi-v7a/libplugins_platforms_qtforandroid_arm64-v8a.so
    // while the same files are correctly rejected as "architecture mismatch"
    // in another phase — so its own arch guard is inconsistent, not absent.
    // Result: 28 aarch64 .so files in base/lib/x86_64/ and base/lib/armeabi-v7a/
    // of an otherwise correct bundle. Reproducible from a clean build.
    //
    // Qt suffixes every library it deploys with the ABI name, so a suffix that
    // disagrees with its directory is unambiguously wrong. Libraries with no
    // ABI suffix (libc++_shared.so, …) match nothing here and are kept.
    //
    // build-android.sh re-checks the finished artifact and hard-fails if any
    // survive, so this exclusion cannot silently stop working.
    // See docs/android-multi-abi-and-chromeos.md.
    packagingOptions.jniLibs.excludes += [
        'lib/arm64-v8a/*_armeabi-v7a.so',
        'lib/arm64-v8a/*_x86_64.so',
        'lib/arm64-v8a/*_x86.so',
        'lib/armeabi-v7a/*_arm64-v8a.so',
        'lib/armeabi-v7a/*_x86_64.so',
        'lib/armeabi-v7a/*_x86.so',
        'lib/x86_64/*_arm64-v8a.so',
        'lib/x86_64/*_armeabi-v7a.so',
        'lib/x86_64/*_x86.so',
        'lib/x86/*_arm64-v8a.so',
        'lib/x86/*_armeabi-v7a.so',
        'lib/x86/*_x86_64.so',
    ]

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion 27

        // Targeting API 36 opts the app in to three behaviours that Android 16
        // enforces with no per-app opt-out:
        //
        //  1. Edge-to-edge display. The activity is laid out under the status
        //     and navigation bars; Window.setDecorFitsSystemWindows(false) is
        //     implied. Clearance comes from Qt's ApplicationWindow safe-area
        //     padding, NOT from the app's own margin setting — see
        //     docs/android-edge-to-edge-and-safe-areas.md.
        //  2. Predictive back is on by default. Opting out again would need
        //     android:enableOnBackInvokedCallback="false" on the <activity>.
        //  3. Orientation/resizability attributes are ignored on large screens
        //     (sw >= 600dp), so the app must tolerate arbitrary resize.
        //
        // compileSdk stays whatever androiddeployqt writes (android-36); AGP
        // 8.6.0 and the JDK 17-21 pin are deliberate and unchanged.
        // See docs/android-multi-abi-and-chromeos.md.
        targetSdkVersion 36
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}

// Skip the debug variant entirely during a release build.
//
// androiddeployqt appends the bare `bundle` task (not `bundleRelease`), which
// asks Gradle for every variant's bundle and so drags the whole debug variant
// through compilation, packaging and signing — 43 :*Debug* tasks whose output
// is thrown away.
//
// The switch has to be conditional because `make android-apk-debug` needs the
// debug variant to exist. build-android.sh exports
// ORG_GRADLE_PROJECT_simsapaReleaseOnly=true for release builds only; Gradle
// maps ORG_GRADLE_PROJECT_<name> environment variables to project properties,
// which is how the flag reaches here without a -P argument (there is nowhere to
// pass one — Gradle is invoked by androiddeployqt, not by us).
//
// Note hasProperty() is true for ANY value, including "false" and "", so the
// variable must be left UNSET for debug builds rather than set to false.
androidComponents {
    beforeVariants(selector().withBuildType("debug")) {
        it.enable = !project.hasProperty("simsapaReleaseOnly")
    }
}
