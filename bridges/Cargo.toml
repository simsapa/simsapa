[package]
name = "simsapa_bridges"
version = "1.0.0-alpha.7"
edition = "2024"
authors = ["Gambhiro Bhikkhu <profound.labs@gmail.com>"]
license = "Apache-2.0"

# This will instruct Cargo to create a static
# library which CMake can link against
[lib]
name = "simsapa_bridges"
path = "src/lib.rs"
# staticlib for cmake cargo
# rlib for api_bin
crate-type = ["staticlib", "rlib"]

[dependencies]
simsapa_backend = { path = "../backend" }
# cxx-qt 0.10.0 requires cxx >= 1.0.176; keep this floor at or above whatever the
# pinned cxx-qt revision asks for, or cargo cannot resolve the two together.
cxx = "1.0.176"
# Unpatched upstream KDAB/cxx-qt 0.10.0 (tag v0.10.0). Pin the commit rev, never a branch: a
# branch re-resolves to the latest commit on every build and makes the
# dependency non-reproducible.
#
# This replaces the former simsapa/cxx-qt fork (rev 8a597414, crate 0.7.2),
# whose Android rcc patch is now covered by the upstream
# CXX_QT_AUTORCC_OPTIONS feature — see CMAKE_AUTORCC_OPTIONS in CMakeLists.txt
# and docs/cxx-qt-fork.md. The remaining fork patches were Apple-only and live
# on the `simsapa` branch of src-lib/cxx-qt-simsapa.
#
# The CMake side is a coupled pair: CMakeLists.txt pins cxx-qt-cmake to the
# matching tag, and a mismatch fails inside generated code. Move them together.
cxx-qt = { git = "https://github.com/KDAB/cxx-qt.git", rev = "6156279" }
cxx-qt-lib = { git = "https://github.com/KDAB/cxx-qt.git", rev = "6156279", features = ["full"] }
qt-build-utils = { git = "https://github.com/KDAB/cxx-qt.git", rev = "6156279" }
rocket = { version = "0.5", features = ["json"] }
rocket_ws = "0.1"
rocket_cors = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1.3.1"
ureq = "3.0.10"
include_dir = "0.7.4"
# Stay on reqwest 0.12 and rig-core 0.30.x. reqwest 0.13's blocking client
# stalls indefinitely on Android after the TLS handshake completes (observed
# against both github.com and pythonanywhere endpoints, with ALPN negotiating
# either h2 or http/1.1), and configured timeouts never fire. rig-core 0.31+
# forces reqwest 0.13 transitively, so the rig-core pin is load-bearing too.
# Retest before bumping either version.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tar = "0.4.44"
bzip2 = "0.6.0"
regex = "1.0"
lazy_static = "1.5.0"
# X-SSP-Columns header value encoding (JSON with non-ASCII labels; decoded
# client-side with decodeURIComponent).
percent-encoding = "2"
rig-core = { version = "0.30.0", default-features = false, features = ["reqwest-rustls"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
# The link_qt_object_files feature is required for statically linking Qt 6.
cxx-qt-build = { git = "https://github.com/KDAB/cxx-qt.git", rev = "6156279", features = ["link_qt_object_files"] }
