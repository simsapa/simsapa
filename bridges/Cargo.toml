[package]
name = "simsapa_bridges"
version = "0.4.4"
edition = "2024"
authors = ["Gambhiro Bhikkhu <profound.labs@gmail.com>"]
license = "Apache-2.0"

# This will instruct Cargo to create a static
# library which CMake can link against
[lib]
name = "simsapa_bridges"
path = "src/lib.rs"
# staticlib for cmake cargo
# rlib for api_bin
crate-type = ["staticlib", "rlib"]

[dependencies]
simsapa_backend = { path = "../backend" }
cxx = "1.0.148"
# simsapa/cxx-qt simsapa branch, fix the commit rev. The branch = "simsapa" always checks for latest rev.
cxx-qt = { git = "https://github.com/simsapa/cxx-qt.git", rev = "8a597414623c704a465f55369ff168f01ca4e93f" }
cxx-qt-lib = { git = "https://github.com/simsapa/cxx-qt.git", rev = "8a597414623c704a465f55369ff168f01ca4e93f", features = ["full"] }
qt-build-utils = { git = "https://github.com/simsapa/cxx-qt.git", rev = "8a597414623c704a465f55369ff168f01ca4e93f" }
rocket = { version = "0.5", features = ["json"] }
rocket_cors = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1.3.1"
ureq = "3.0.10"
include_dir = "0.7.4"
# Stay on reqwest 0.12 and rig-core 0.30.x. reqwest 0.13's blocking client
# stalls indefinitely on Android after the TLS handshake completes (observed
# against both github.com and pythonanywhere endpoints, with ALPN negotiating
# either h2 or http/1.1), and configured timeouts never fire. rig-core 0.31+
# forces reqwest 0.13 transitively, so the rig-core pin is load-bearing too.
# Retest before bumping either version.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tar = "0.4.44"
bzip2 = "0.6.0"
regex = "1.0"
lazy_static = "1.5.0"
# X-SSP-Columns header value encoding (JSON with non-ASCII labels; decoded
# client-side with decodeURIComponent).
percent-encoding = "2"
rig-core = { version = "0.30.0", default-features = false, features = ["reqwest-rustls"] }
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
# The link_qt_object_files feature is required for statically linking Qt 6.
cxx-qt-build = { git = "https://github.com/simsapa/cxx-qt.git", rev = "8a597414623c704a465f55369ff168f01ca4e93f", features = ["link_qt_object_files"] }
