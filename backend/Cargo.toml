[package]
name = "simsapa_backend"
version = "1.0.0-alpha.7"
edition = "2024"
authors = ["Gambhiro Bhikkhu <profound.labs@gmail.com>"]
license = "Apache-2.0"

[lib]
name = "simsapa_backend"
path = "src/lib.rs"
doctest = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
libsqlite3-sys = { version = ">=0.32", features = ["bundled"] }
diesel = { version = "2.3.9", features = ["sqlite", "r2d2", "chrono", "returning_clauses_for_sqlite_3_35", "64-column-tables"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
dotenvy = "0.15.7"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
tinytemplate = "1.2.1"
walkdir = "2.5.0"
time = { version = "0.3.41", features = ["local-offset", "formatting", "macros"] }
app_dirs = { package = "app_dirs2", version = "2.5" }
anyhow = "1.0"
thiserror = "2.0"
stardict = { version = "0.2.2", features = ["sqlite"] }
lazy_static = "1.5.0"
# NFD decomposition for the CIPS index parser's diacritic stripping
# (`cips_parse::normalize_diacritic_string`). Same version the `cli` crate uses.
unicode-normalization = "0.1"
html-escape = "0.2.13"
markdown = "1.0.0"
parking_lot = "0.12.3"
cfg-if = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
epub = "=2.1.5"
pdf-extract = "0.7"
lopdf = "0.34"
html5ever = "0.27"
scraper = "0.21.0"
markup5ever_rcdom = "0.3"
markup5ever = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tantivy = "0.25"
# Advisory file locking (flock(2)) and memory mapping, used by the storage
# diagnostics probes and by the lenient Directory wrapper. Both are already in
# Cargo.lock transitively via tantivy (0.13.1 / 0.9.10), so naming them here
# adds no second copy. fs4's default `sync` feature is what provides
# `fs4::fs_std::FileExt`; its free functions also give cross-platform
# free/total space, so no per-cfg statvfs helper is needed.
fs4 = "0.13"
memmap2 = "0.9"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.18"
flacenc = "0.5"
rubato = "3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
urlencoding = "2.1"
# Stable digest for the gloss word-context cache keys (std's DefaultHasher is
# not stable across Rust versions).
sha2 = "0.10"

# Pulled in *only* for the errno constants of the flock support probe and the
# `statfs` magic of the storage diagnostics: fs4 0.13 is rustix-based and
# deliberately libc-free, so it exports none. Unix-only on purpose — on Windows
# `io::Error::raw_os_error()` yields Win32 codes, not CRT errnos, and comparing
# those against libc's Windows constants would silently misclassify ordinary
# errors as "locking unsupported" (see `backend/src/search/lenient_directory.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
# cpal's AAudio backend reads the JavaVM/Activity through ndk_context, which Qt
# for Android does not initialize. We set it explicitly at startup (see
# init_android_context in lib.rs).
ndk-context = "0.1"
# Writing into a Storage Access Framework tree URI (FolderDialog on Android
# returns a content:// URI, not a path) requires the Android ContentResolver via
# JNI. Pinned to 0.21 to reuse the copy app_dirs2 already compiles for Android
# (0.22.4 — cpal's copy — is an experimental redesign with a closure-scoped Env
# and typed method signatures; 0.21 is the stable classic API). This adds no new
# jni copy to the tree. See docs/android-file-saving-saf.md.
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
colored = "3.0"

[dev-dependencies]
serial_test = "3.0"

[lints.clippy]
missing_safety_doc = "allow"
