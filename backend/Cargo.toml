[package]
name = "simsapa_backend"
version = "1.3.3"
edition = "2024"
authors = ["Gambhiro Bhikkhu <profound.labs@gmail.com>"]
license = "Apache-2.0"

[lib]
name = "simsapa_backend"
path = "src/lib.rs"
doctest = false

[features]
default = ["audio"]
# Chanting-practice recording, playback and waveforms (`audio`, `waveform`).
# Without it a recording's duration reads as unknown (0).
audio = ["dep:cpal", "dep:symphonia", "dep:flacenc", "dep:rubato"]
# The AI provider engine (`ai_engine`) and the runs built on it
# (`gloss_word_selection_run`). On for `bridges` and `backend_cli`; off for
# `simsapa_api`, which must build without `rig-core`.
ai = ["dep:rig-core", "dep:tokio"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
libsqlite3-sys = { version = ">=0.32", features = ["bundled"] }
diesel = { version = "2.3.9", features = ["sqlite", "r2d2", "chrono", "returning_clauses_for_sqlite_3_35", "64-column-tables"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
dotenvy = "0.15.7"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
indexmap = { version = "2.0", features = ["serde"] }
tinytemplate = "1.2.1"
walkdir = "2.5.0"
time = { version = "0.3.41", features = ["local-offset", "formatting", "macros"] }
app_dirs = { package = "app_dirs2", version = "2.5" }
anyhow = "1.0"
toml = "1.1.6"
thiserror = "2.0"
stardict = { version = "0.2.2", features = ["sqlite"] }
lazy_static = "1.5.0"
# NFD decomposition for the CIPS index parser's diacritic stripping
# (`cips_parse::normalize_diacritic_string`). Same version the `bootstrap_cli` crate uses.
unicode-normalization = "0.1"
html-escape = "0.2.13"
markdown = "1.0.0"
parking_lot = "0.12.3"
cfg-if = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
epub = "=2.1.5"
pdf-extract = "0.7"
lopdf = "0.34"
html5ever = "0.27"
scraper = "0.21.0"
markup5ever_rcdom = "0.3"
markup5ever = "0.12"
base64 = "0.22"
# Stay on reqwest 0.12 and rig-core 0.30.x. reqwest 0.13's blocking client
# stalls indefinitely on Android after the TLS handshake completes (observed
# against both github.com and pythonanywhere endpoints, with ALPN negotiating
# either h2 or http/1.1), and configured timeouts never fire. rig-core 0.31+
# forces reqwest 0.13 transitively, so the rig-core pin is load-bearing too.
# Retest before bumping either version.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# The `ai` feature's provider engine (see the reqwest pin above).
rig-core = { version = "0.30.0", default-features = false, features = ["reqwest-rustls"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tantivy = "0.25"
# Advisory file locking (flock(2)) and memory mapping, used by the storage
# diagnostics probes and by the lenient Directory wrapper. Both are already in
# Cargo.lock transitively via tantivy (0.13.1 / 0.9.10), so naming them here
# adds no second copy. fs4's default `sync` feature is what provides
# `fs4::fs_std::FileExt`; its free functions also give cross-platform
# free/total space, so no per-cfg statvfs helper is needed.
fs4 = "0.13"
memmap2 = "0.9"
# The chanting-practice audio stack, behind the default-on `audio` feature.
# The GUI keeps it; the headless `simsapa` CLI and `simsapa_api` build without
# it, so they link no ALSA/CoreAudio/WASAPI. See docs/pure-rust-audio-backend.md.
symphonia = { version = "0.5", features = ["all"], optional = true }
cpal = { version = "0.18", optional = true }
flacenc = { version = "0.5", optional = true }
rubato = { version = "3", optional = true }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# DPD upgrades: `dpd.db.tar.xz` is one tar entry in a multi-block xz stream
# with CRC64 checks. lzma-rust2 is pure Rust, so the staticlib needs no native
# liblzma on any platform; single-threaded, since its multi-threaded reader
# holds whole decompressed blocks (~190 MB each) in memory.
tar = "0.4.44"
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "xz", "optimization"] }
urlencoding = "2.1"
# Stable digest for the gloss word-context cache keys (std's DefaultHasher is
# not stable across Rust versions).
sha2 = "0.10"

# Pulled in *only* for the errno constants of the flock support probe and the
# `statfs` magic of the storage diagnostics: fs4 0.13 is rustix-based and
# deliberately libc-free, so it exports none. Unix-only on purpose — on Windows
# `io::Error::raw_os_error()` yields Win32 codes, not CRT errnos, and comparing
# those against libc's Windows constants would silently misclassify ordinary
# errors as "locking unsupported" (see `backend/src/search/lenient_directory.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
# cpal's AAudio backend reads the JavaVM/Activity through ndk_context, which Qt
# for Android does not initialize. We set it explicitly at startup (see
# init_android_context in lib.rs).
ndk-context = "0.1"
# Writing into a Storage Access Framework tree URI (FolderDialog on Android
# returns a content:// URI, not a path) requires the Android ContentResolver via
# JNI. Pinned to 0.21 to reuse the copy app_dirs2 already compiles for Android
# (0.22.4 — cpal's copy — is an experimental redesign with a closure-scoped Env
# and typed method signatures; 0.21 is the stable classic API). This adds no new
# jni copy to the tree. See docs/android-file-saving-saf.md.
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
colored = "3.0"

[[example]]
name = "dbg_flac"
required-features = ["audio"]

[dev-dependencies]
serial_test = "3.0"
# The archive tests write a small .tar.xz.
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "xz", "encoder"] }

[lints.clippy]
missing_safety_doc = "allow"

# Dependencies are built optimised in dev and test builds: SQLite (compiled C),
# regex and sha2 at opt-level 0 made the tests on the dist databases several
# times slower. The project's own crates stay unoptimised, so they rebuild fast
# after an edit and step cleanly in a debugger.
[profile.dev.package."*"]
opt-level = 2
