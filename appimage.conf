# AppImage configuration for Simsapa
# This file contains configuration for linuxdeploy

[qt]
# Qt6 WebEngine requires additional resources
deploy_qt_translations = true
qml_modules_dir = qml
# NOTE: build-appimage.sh does NOT read this file -- it exports its own
# QML_SOURCES_PATHS. The two are independent copies of the same value; if the
# QML tree moves again, both have to be updated.
qml_sources_paths = bridges/assets/qml

[linuxdeploy]
# Additional libraries that might be needed
exclude_libraries = 
include_libraries = 

[desktop]
# Desktop integration settings
update_information = gh-releases-zsync|simsapa|simsapa|latest|Simsapa-*-x86_64.AppImage.zsync
categories = Education;Literature;Office;
