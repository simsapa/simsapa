[package]
name = "simsapa_backend_cli"
version = "1.3.3"
edition = "2024"
authors = ["Gambhiro Bhikkhu <profound.labs@gmail.com>"]
license = "Apache-2.0"
description = "Simsapa from the command line: set up the databases, search suttas and dictionaries, gloss Pāli text, and serve the localhost API."

# The public `simsapa` CLI, published to npm as `@simsapa/cli`. Qt-free, with no
# audio and no bootstrap tooling (that is `bootstrap_cli`).
# See docs/backend-cli-and-npm-package.md.

[[bin]]
name = "simsapa"
path = "src/main.rs"

[dependencies]
# No `audio` (a backend default feature); `ai` for AI word selection and
# translation in `simsapa gloss`.
simsapa_backend = { path = "../backend", default-features = false, features = ["ai"] }
simsapa_api = { path = "../api" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
tokio = { version = "1.0", features = ["full"] }
ctrlc = "3.4"
dialoguer = { version = "0.11", default-features = false }
# The same features as the backend's: blocking, rustls, no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tar = "0.4.44"
bzip2 = "0.6.0"
# The `cli-write.lock` advisory lock (the version tantivy and the backend use).
fs4 = "0.13"
html-escape = "0.2.13"
# `simsapa serve` launches `simsapa_api::build_rocket()` (the same version).
rocket = { version = "0.5", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The global allocator of the static Linux builds only (musl's own is slow).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
# The EPUB fixture of the book-import test; the version `backend` uses.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The installed databases and release archives of the DPD upgrade tests; the
# versions `backend` uses.
diesel = { version = "2.3.9", features = ["sqlite"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
sha2 = "0.10"
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "xz", "encoder"] }

# Applies only when this crate is the build root, so it never affects the GUI's
# build (bridges) or the backend's tests. See docs/backend-cli-and-npm-package.md.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Dependencies are built optimised in dev and test builds: SQLite (compiled C),
# regex and sha2 at opt-level 0 made the tests on the dist databases several
# times slower. The project's own crates stay unoptimised, so they rebuild fast
# after an edit and step cleanly in a debugger.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.simsapa_backend]
opt-level = 0

[profile.dev.package.simsapa_api]
opt-level = 0
